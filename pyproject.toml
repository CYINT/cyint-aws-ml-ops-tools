[tool.poetry]
name = "cyint-aws-ml-ops-tools"
version = "2.0.0"
description = "Tools for assisting with managing modern ml-ops-pipelines in AWS Sagemaker"
authors = ["Daniel Fredriksen <dfredriksen@cyint.technology>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12.15,<3.13"
boto3 = "1.43.118"
sagemaker = "2.257.7"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-mock = "3.17.0"
pytest-cov = "7.1.0"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
